{% extends "base.html" %}
{% block title %}Reset password — Sample Tracker{% endblock %}
{% block bare_content %}
<div class="login-screen">
  <form class="login-card" method="post" action="/reset-password">
    <div class="brand" style="margin-bottom: 24px;">
      <span class="brand-mark">JJ</span>
      <span class="brand-name">Sample&nbsp;Tracker</span>
    </div>
    <h1>Choose a new password</h1>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    {% if token %}
    <input type="hidden" name="token" value="{{ token }}">
    <label>New password
      <input type="password" name="password" required minlength="8" autofocus>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" required minlength="8">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Reset password</button>
    {% else %}
    <p style="font-size:13px;text-align:center;margin-top:14px;">
      <a href="/forgot-password" style="color:var(--navy);font-weight:600;">Request a new reset link</a>
    </p>
    {% endif %}
  </form>
</div>
{% endblock %}
