<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">SKU</label>
        <input type="text" name="sku" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">SKU Description</label>
        <input type="text" name="sku_description" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Product / Item Type</label>
        <input type="text" name="item_type" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Client</label>
        <input type="text" name="client" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Supplier</label>
        <input type="text" name="supplier" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Vendor Ref</label>
        <input type="text" name="vendor_ref" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Barcode</label>
        <input type="text" name="barcode" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Size</label>
        <input type="text" name="size" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Location</label>
        <input type="text" name="location" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Rack</label>
        <input type="text" name="rack" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Seal No.</label>
        <input type="text" name="seal_no" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Start Date</label>
        <input type="date" name="start_date" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Status</label>
        <div style="display: flex; align-items: center; gap: 8px; padding-top: 6px;">
            <input type="checkbox" class="status-toggle" checked style="width: auto;">
            <span class="toggle-word" style="font-size: 14px;">Active</span>
            <input type="hidden" name="status" value="Active">
        </div>
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px;">Image Upload</label>
        <input type="file" name="image" accept="image/*" style="width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px;">
    </div>
</div>
<div class="modal-img-preview" style="display: none; margin-bottom: 12px;">
    <img src="" alt="Sample Image" style="max-width: 100%; max-height: 150px; border-radius: 4px;">
</div>
